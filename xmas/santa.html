<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Xmas">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Secret Santa · Christmas at Bateau Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.big{text-align:center;padding:22px 16px;background:linear-gradient(160deg,#FFF3F0,#FFE1DC);border-color:#F3B9B2}
.big h2{font-family:'Fraunces',serif;font-weight:900;font-size:30px;margin:0 0 4px}
.big .n{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
.bigbtn{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px;font-size:19px;font-weight:600}
.bigbtn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.facts{display:grid;gap:6px;font-size:15px}
.facts div{display:flex;gap:10px}
.facts small{flex:none;width:76px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);padding-top:4px}
.hhhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hhhead b{flex:1;min-width:0;font-size:14.5px}
.hhhead .btn{flex:none}
.whos{display:flex;flex-wrap:wrap;gap:7px}
.who{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:15px;min-height:44px}
.who[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.who[aria-pressed="true"]::before{content:'✓ '}
.gift{display:block;width:100%;border:0;border-radius:20px;text-align:center;padding:26px 16px;margin-bottom:12px;color:#fff;cursor:pointer;
  background:
   linear-gradient(90deg,transparent 43%,var(--gold) 43%,var(--gold) 57%,transparent 57%),
   linear-gradient(0deg,transparent 40%,var(--gold) 40%,var(--gold) 52%,transparent 52%),
   linear-gradient(160deg,#E4473B,#A8231A);
  box-shadow:0 14px 30px -14px rgba(150,30,20,.8)}
.gift .t{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:block;background:rgba(168,35,26,.92);border-radius:8px;padding:4px 8px;width:max-content;max-width:100%;margin:0 auto 6px}
.gift .e{font-size:54px;line-height:1.1;display:block}
.gift .p{display:inline-block;margin-top:8px;background:#fff;color:var(--red);font-weight:700;font-size:17px;border-radius:999px;padding:10px 22px}
.gift.open{background:linear-gradient(160deg,#fff,#F1FAF4);color:var(--ink);border:2px solid var(--green);text-align:left;padding:18px 16px}
.gift.open .t{background:none;color:var(--ink-soft);padding:0;margin:0 0 4px}
.gift.open .nm{font-family:'Fraunces',serif;font-weight:900;font-size:34px;line-height:1;display:block;margin:2px 0 6px}
.gift.open .fam{font-size:14px;color:var(--ink-soft);display:block;margin-bottom:10px}
.gift.open .wl{border-top:1px dashed var(--line);padding-top:10px;font-size:15px;white-space:pre-wrap}
.gift.open .wl small{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px}
.gift.open .hint{display:block;text-align:center;margin-top:12px;font-size:12.5px;color:var(--ink-soft)}
.wl{font-size:15px;white-space:pre-wrap;margin-top:6px}
.wl small{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0 2px;font-size:15px}
.chk input{width:22px;height:22px}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="home.html">← Home</a>
  <p class="eyebrow">Shh</p>
  <h1 class="wordmark">Secret Santa</h1>
  <p class="sub" id="sub">&nbsp;</p>
</header>

<main>
  <div id="app"><div class="empty">Loading…</div></div>
  <p class="buildstamp">build x30</p>
</main>

<script type="module">
import { boot, me, col, settings, celebrate, jingle, toast, openSheet, closeSheet, askPin, esc,
         people, households, household, person, pname, badge, onPeople, heroFromWall } from "./app.js";

/* The pairs are lightly scrambled so they can't be read at a glance in the database. */
const scramble = (giver, receiver) => btoa([...(giver + "|" + receiver)].reverse().join(""));
const unscramble = v => {
  try{ const s = [...atob(v)].reverse().join(""), i = s.indexOf("|");
    return i < 0 ? null : { giver:s.slice(0, i), receiver:s.slice(i + 1) }; }catch(e){ return null; }
};

if(boot("santa.html")){
const $ = id => document.getElementById(id);
heroFromWall();

const DEFAULTS = { state:"open", budget:"$20–25", rules:"", swapWhen:"11am Christmas Day", in:{}, noSameFamily:true, pairs:{} };
let S = { ...DEFAULTS }, wishes = [], loaded = false;
let showMine = false, famPeek = null, famOpen = false;   // who's revealed right now (a giver id), never stored

const wishOf = id => wishes.find(w => w.id === id);
const playing = () => people().filter(p => S.in && S.in[p.id]);
const receiverOf = giver => {
  const v = S.pairs && S.pairs[giver]; if(!v) return null;
  const u = unscramble(v); return u && u.giver === giver ? u.receiver : null;
};
const save = v => settings("santa").save(v).catch(e => toast("Couldn't save — " + e.message));

/* ---------- the draw ---------- */
const shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function makePairs(ids, noFam){
  for(let t = 0; t < 500; t++){
    const r = shuffle(ids);
    if(r.every((x, i) => x !== ids[i] && (!noFam || person(x).hh !== person(ids[i]).hh)))
      return Object.fromEntries(ids.map((g, i) => [g, r[i]]));
  }
  return null;
}
async function runDraw(noFam){
  const ids = playing().map(p => p.id);
  if(ids.length < 3) return toast("Need at least 3 people playing");
  const m = makePairs(ids, noFam);
  if(!m){
    toast("Couldn't keep everyone off their own family — one family is more than half the players.", 5000);
    const sh = openSheet(`<h3>That rule won't fit</h3><p class="muted small">One family is too big to keep everyone away from their own people. You can draw without that rule instead.</p>
      <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn red" id="go">Draw without it</button></div>`);
    sh.el.querySelector("#no").onclick = () => closeSheet();
    sh.el.querySelector("#go").onclick = () => { closeSheet(); runDraw(false); };
    return;
  }
  const pairs = Object.fromEntries(Object.keys(S.pairs || {}).map(k => [k, ""]));   // wipe any old ones
  ids.forEach(g => { pairs[g] = scramble(g, m[g]); });
  jingle(); showMine = false; famPeek = null; famOpen = false;
  await save({ state:"drawn", pairs, noSameFamily:noFam });
  toast("Names drawn! Have a peek 🎅");
}
async function drawClick(again){
  if(!(await askPin(again ? "Drawing again changes everyone's person." : "Only an organiser can draw the names."))) return;
  if(!again) return runDraw(S.noSameFamily !== false);
  const sh = openSheet(`<h3>Draw again?</h3><p class="muted small">Everyone gets a <b>new person</b>. Anyone who has already peeked will have the wrong one, so tell the family.</p>
    <div class="acts"><button class="btn ghost" id="no">Keep as is</button><button class="btn red" id="go">Draw again</button></div>`);
  sh.el.querySelector("#no").onclick = () => closeSheet();
  sh.el.querySelector("#go").onclick = () => { closeSheet(); runDraw(S.noSameFamily !== false); };
}
async function backToSignup(){
  if(!(await askPin("This clears everyone's person."))) return;
  const sh = openSheet(`<h3>Back to sign-up?</h3><p class="muted small">This <b>throws away the draw</b>. You can draw fresh once everyone's in.</p>
    <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn red" id="go">Back to sign-up</button></div>`);
  sh.el.querySelector("#no").onclick = () => closeSheet();
  sh.el.querySelector("#go").onclick = async () => {
    closeSheet(); showMine = false; famPeek = null; famOpen = false;
    await save({ state:"open", pairs:Object.fromEntries(Object.keys(S.pairs || {}).map(k => [k, ""])) });
  };
}

/* ---------- who's playing ---------- */
const setIn = (ids, val) => save({ in:{ ...(S.in || {}), ...Object.fromEntries(ids.map(i => [i, val])) } });

/* ---------- sheets: rules and wish list ---------- */
async function editRules(){
  if(!(await askPin("Only organisers change the rules."))) return;
  const open = S.state !== "drawn";
  const sh = openSheet(`<h3>Santa rules</h3>
    <label class="f" for="b">Spending limit</label><input class="in" id="b" value="${esc(S.budget)}">
    <label class="f" for="r">Rules (optional)</label><input class="in" id="r" value="${esc(S.rules)}" placeholder="e.g. Something for the beach">
    <label class="f" for="w">When do we swap?</label><input class="in" id="w" value="${esc(S.swapWhen)}">
    ${open ? `<label class="chk"><input type="checkbox" id="nf" ${S.noSameFamily !== false ? "checked" : ""}> Nobody gets someone from their own family</label>` : ""}
    <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn green" id="go">Save</button></div>`);
  const q = s => sh.el.querySelector(s);
  q("#no").onclick = () => closeSheet();
  q("#go").onclick = () => {
    const v = { budget:q("#b").value.trim(), rules:q("#r").value.trim(), swapWhen:q("#w").value.trim() };
    if(open) v.noSameFamily = q("#nf").checked;
    closeSheet(); save(v);
  };
}
function editWish(){
  const w = wishOf(me.id) || {};
  const sh = openSheet(`<h3>My wish list</h3><p class="muted small">Only your Santa sees this — well, anyone who's buying for you.</p>
    <label class="f" for="t">Things I'd love</label><textarea class="in" id="t" placeholder="Beach towel, a good book, lollies…">${esc(w.text)}</textarea>
    <label class="f" for="s">Sizes (if clothes)</label><input class="in" id="s" value="${esc(w.sizes)}">
    <label class="f" for="n">Please no…</label><input class="in" id="n" value="${esc(w.no)}" placeholder="e.g. no chocolate, no candles">
    <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn green" id="go">Save</button></div>`);
  const q = s => sh.el.querySelector(s);
  q("#no").onclick = () => closeSheet();
  q("#go").onclick = async () => {
    const v = { text:q("#t").value.trim(), sizes:q("#s").value.trim(), no:q("#n").value.trim() };
    const first = !wishOf(me.id);
    closeSheet(); if(first) celebrate("wish");
    try{ await col("wishes").set(me.id, v); }catch(e){ toast("Couldn't save — " + e.message); }
  };
}

/* ---------- painting ---------- */
const wishBlock = w => w && (w.text || w.sizes || w.no)
  ? `<div class="wl">${esc(w.text || "No ideas yet")}${w.sizes ? `<small>Sizes</small>${esc(w.sizes)}` : ""}${w.no ? `<small>Please no</small>${esc(w.no)}` : ""}</div>`
  : `<div class="wl muted">No wish list yet — keep it thoughtful, or ask them.</div>`;

function gift(key, giver, heading){
  const on = key === "mine" ? showMine : famOpen && famPeek === giver;
  if(!on) return `<button class="gift" data-gift="${esc(key)}" data-giver="${esc(giver)}" aria-label="Tap to peek"><span class="t">${esc(heading)}</span><span class="e">🎁</span><span class="p">Tap to peek</span></button>`;
  const rid = receiverOf(giver), r = person(rid), h = household(r.hh);
  return `<div class="gift open" role="button" tabindex="0" data-gift="${esc(key)}" data-giver="${esc(giver)}"><span class="t">${esc(heading)}</span>
    <span class="nm">${esc(pname(rid))}</span><span class="fam">${badge(r.hh)} Family: ${esc(h.name)}</span>${wishBlock(wishOf(rid))}
    <span class="hint">Tap to hide</span></div>`;
}

function paint(){
  if(!loaded) return;
  const drawn = S.state === "drawn", n = playing().length;
  $("sub").textContent = drawn ? "The names are drawn" : `${n} playing`;
  const facts = `<div class="card"><div class="facts">
      <div><small>Spend</small><span>${esc(S.budget || "—")}</span></div>
      ${S.rules ? `<div><small>Rules</small><span>${esc(S.rules)}</span></div>` : ""}
      <div><small>Swap</small><span>${esc(S.swapWhen || "—")}</span></div></div>
      <p style="margin:10px 0 0"><button class="btn small ghost" data-act="rules">Change (organiser)</button></p></div>`;
  const w = wishOf(me.id);
  const myWish = `<div class="card"><b>My wish list</b>${wishBlock(w)}<p style="margin:10px 0 0"><button class="btn small" data-act="wish">${w ? "Edit my wish list" : "Add my wish list"}</button></p></div>`;
  let h = "";
  if(!drawn){
    const amIn = !!(S.in && S.in[me.id]);
    h += `<div class="card big"><h2>Are you in?</h2><p class="n">${n} playing</p>
      <button class="bigbtn" id="meToggle" aria-pressed="${amIn}" data-act="me">${amIn ? "I'm in 🎅 (tap to leave)" : "Count me in"}</button></div>`;
    h += facts + `<h2 class="sec">My wish list</h2>` + myWish;
    h += `<h2 class="sec">Who's playing</h2><p class="muted small" style="margin:-4px 2px 10px">Kids and grandparents not on the site? Tick them in here.</p>`;
    households().forEach(hh => {
      const ms = hh.members, inN = ms.filter(p => S.in && S.in[p.id]).length, all = inN === ms.length;
      h += `<div class="card"><div class="hhhead">${badge(hh.id)}<b>${esc(hh.name)}</b>
        <button class="btn small ${all ? "ghost" : "green"}" data-act="fam" data-hh="${esc(hh.id)}" data-all="${all}">${all ? "Everyone out" : "Whole family in"}</button></div>
        <div class="whos">${ms.map(p => `<button class="who" data-act="who" data-id="${esc(p.id)}" aria-pressed="${!!(S.in && S.in[p.id])}">${esc(p.label)}</button>`).join("")}</div></div>`;
    });
    h += `<h2 class="sec">Organiser</h2><div class="card"><p class="muted small" style="margin-top:0">Once everyone's in, draw the names. Needs at least 3 players.${S.noSameFamily !== false ? " Nobody will get someone from their own family." : ""}</p>
      <button class="btn red wide" data-act="draw">🎅 Draw the names</button></div>`;
  } else {
    const mine = receiverOf(me.id);
    if(mine) h += gift("mine", me.id, "You're buying for…");
    else h += `<div class="card big"><h2>You're not in the draw</h2><p class="muted" style="margin:0">That's okay — you joined after the names were drawn. Ask an organiser if you'd like to be added.</p></div>`;
    h += facts;
    const fam = household(me.hh).members.filter(p => p.id !== me.id && receiverOf(p.id));
    if(fam.length){
      h += `<h2 class="sec">Peek for someone in my family</h2><div class="card"><p class="muted small" style="margin-top:0">Sharing a phone, or they're not on the site? Pick them, then tap the gift.</p>
        <div class="whos">${fam.map(p => `<button class="who" data-act="pick" data-id="${esc(p.id)}" aria-pressed="${famPeek === p.id}">${esc(p.label)}</button>`).join("")}</div></div>`;
      if(famPeek && fam.some(p => p.id === famPeek)) h += gift("fam", famPeek, `${pname(famPeek)} is buying for…`);
    }
    h += `<h2 class="sec">My wish list</h2>` + myWish;
    h += `<h2 class="sec">Organiser</h2><div class="card"><p class="muted small" style="margin-top:0">${n} playing.</p>
      <div class="row"><button class="btn ghost" data-act="again">Draw again</button><button class="btn ghost" data-act="back">Back to sign-up</button></div></div>`;
  }
  $("app").innerHTML = h;
}

$("app").addEventListener("click", e => {
  const g = e.target.closest("[data-gift]");
  if(g){
    if(g.dataset.gift === "mine") showMine = !showMine; else famOpen = !famOpen;
    return paint();
  }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a === "me"){ const v = b.getAttribute("aria-pressed") !== "true"; if(v){ celebrate("santa"); } setIn([me.id], v); }
  else if(a === "who"){ const v = b.getAttribute("aria-pressed") !== "true"; if(v && b.dataset.id === me.id) celebrate("santa"); setIn([b.dataset.id], v); }
  else if(a === "fam"){
    const v = b.dataset.all !== "true", ids = household(b.dataset.hh).members.map(p => p.id);
    if(v && ids.includes(me.id) && !(S.in && S.in[me.id])) celebrate("santa");
    setIn(ids, v);
  }
  else if(a === "pick"){ famPeek = famPeek === b.dataset.id ? null : b.dataset.id; famOpen = false; paint(); }
  else if(a === "rules") editRules();
  else if(a === "wish") editWish();
  else if(a === "draw") drawClick(false);
  else if(a === "again") drawClick(true);
  else if(a === "back") backToSignup();
});
$("app").addEventListener("keydown", e => { if((e.key === "Enter" || e.key === " ") && e.target.matches(".gift.open")){ e.preventDefault(); e.target.click(); } });
// hide anything revealed when the phone is put down
document.addEventListener("visibilitychange", () => { if(document.hidden && (showMine || famOpen)){ showMine = false; famOpen = false; paint(); } });

onPeople(paint);
settings("santa").subscribe(s => { S = { ...DEFAULTS, ...(s || {}) }; S.in = S.in || {}; S.pairs = S.pairs || {}; loaded = true; paint(); });
col("wishes").subscribe(r => { wishes = r; paint(); });
}
</script>
</body>
</html>
