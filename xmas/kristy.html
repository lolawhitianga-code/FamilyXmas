<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Xmas">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>The Kristy Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.count{text-align:center;padding:18px 14px}
.count .n{font-family:'Fraunces',serif;font-weight:900;font-size:64px;line-height:.9;color:var(--red)}
.count .l{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.sealed{text-align:center;border:2px dashed var(--line);border-radius:16px;padding:22px 14px;background:repeating-linear-gradient(-45deg,#fff 0 18px,#FFF7EA 18px 36px)}
.sealed b{display:block;font-family:'Fraunces',serif;font-size:22px;margin-bottom:4px}
.case{position:relative}
.case .no{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.16em;color:var(--red)}
.case .st{font-size:17px;line-height:1.4;margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.case .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
body.big .case .st{font-size:24px}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="home.html">← Home</a>
  <p class="eyebrow">Strictly confidential</p>
  <h1 class="wordmark">The Kristy Files</h1>
  <p class="sub" id="sub">Sealed until the big reveal</p>
</header>
<main>
  <div class="card count"><div class="n" id="n">0</div><div class="l">anonymous reports filed</div></div>
  <button class="btn red wide" id="file">🚨 Report a Kristy incident</button>
  <p class="small muted" style="text-align:center;margin:8px 0 6px">Anonymous. No name is saved. Kristy can't see this page.</p>
  <p style="text-align:center;margin:0 0 18px"><button class="chip" id="popToggle"></button></p>

  <div id="sealed" class="sealed"><b>🔒 Sealed</b>
    <span class="muted small">The reports stay locked until the organisers open them at camp, with Kristy in the room.</span>
    <p style="margin:12px 0 0"><button class="btn" id="open">Open the files (organiser PIN)</button></p></div>

  <div id="opened" class="hide">
    <div class="acts2"><button class="chip" id="big">🔎 Bigger text for reading out</button><button class="chip" id="seal">🔒 Seal them again</button></div>
    <div id="list"></div>
  </div>
  <p class="buildstamp">build x30</p>
</main>
<script type="module">
import { boot, col, heroFromWall, esc, askPin, toast, isKristy, reportKristy, KRISTY_SCALE, kristyOff, setKristyOff } from "./app.js";
if(isKristy()) location.replace("home.html");
else if(boot("kristy.html")){
const $ = id => document.getElementById(id);
heroFromWall();
let rows = [], open = false, armed = null;

function paint(){
  $("n").textContent = rows.length;
  $("sealed").classList.toggle("hide", open); $("opened").classList.toggle("hide", !open);
  $("sub").textContent = open ? "Opened for the reveal" : "Sealed until the big reveal";
  if(!open){ $("list").innerHTML = ""; return; }      // nothing readable is put on the page while sealed
  // shuffled by a random number saved with each report, so the order says nothing about who filed when
  const xs = [...rows].sort((a, b) => (a.n || 0) - (b.n || 0));
  $("list").innerHTML = xs.length ? xs.map((r, i) => `<div class="tag red case">
      <div class="no">CASE FILE ${String(i + 1).padStart(3, "0")}</div>
      <div class="st">${esc(r.story)}</div>
      <div class="meta">${r.when ? `<span class="pill">${esc(r.when)}</span>` : ""}<span class="pill gold">${esc(KRISTY_SCALE[r.sev] || "")}</span>
        <button class="chip" data-del="${r.id}" style="margin-left:auto">${armed === r.id ? "Really remove?" : "Remove"}</button></div></div>`).join("")
    : `<div class="empty">No reports yet. Either Kristy is innocent, or everyone is still too scared.</div>`;
}
col("kristy").subscribe(r => { rows = r; paint(); });

$("file").onclick = reportKristy;
const paintToggle = () => $("popToggle").textContent = kristyOff() ? "🔔 Turn the Kristy pop-ups back on for me" : "🔕 Stop the Kristy pop-ups for me";
paintToggle(); addEventListener("xmas-kristyoff", paintToggle);      // and again whenever the choice changes or loads
$("popToggle").onclick = async () => { const off = !kristyOff();
  try{ await setKristyOff(off); }catch(e){ toast("Saved on this phone only — " + e.message); }
  paintToggle(); toast(off ? "No more Kristy pop-ups for you" : "Kristy pop-ups are back on"); };
$("open").onclick = async () => { if(await askPin("Opening the Kristy Files is for the big reveal — make sure Kristy's there to defend herself.")){ open = true; paint(); } };
$("seal").onclick = () => { open = false; paint(); };
$("big").onclick = () => document.body.classList.toggle("big");
$("list").addEventListener("click", async e => {
  const b = e.target.closest("[data-del]"); if(!b) return;
  if(armed !== b.dataset.del){ armed = b.dataset.del; paint(); return; }
  armed = null;
  try{ await col("kristy").remove(b.dataset.del); toast("Removed"); }catch(err){ toast("Couldn't remove — " + err.message); }
});
}
</script>
</body>
</html>
