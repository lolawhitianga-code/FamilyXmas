<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Xmas">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Money — Christmas at Bateau Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.pos{text-align:center;padding:20px 14px 16px}
.pos .big{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(30px,9vw,44px);line-height:1.05;margin:2px 0 4px}
.pos.owed{background:linear-gradient(160deg,#F1FAF4,#DDF2E5);border-color:#B5DDC5} .pos.owed .big{color:var(--green)}
.pos.owes{background:linear-gradient(160deg,#FFF3F0,#FFE1DC);border-color:#F3B9B2} .pos.owes .big{color:var(--red)}
.pos.sq .big{color:var(--ink)}
.xf{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.xf:first-of-type{border-top:0}
.xf .who{flex:1;min-width:0;font-size:14.5px;line-height:1.3}
.xf .who b{font-weight:600}
.xf .amt{font-family:'DM Mono',monospace;font-weight:500;white-space:nowrap}
.xf.mine{background:#FFF8E0;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.addbtn{width:100%;margin:2px 0 6px;padding:14px;font-size:17px}
.dayh{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin:18px 2px 7px}
.ex{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.ex .e{font-size:25px;flex:none;width:32px;text-align:center}
.ex .t{flex:1;min-width:0}
.ex .t b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ex .t > span{display:block;font-size:12.5px;color:var(--ink-soft)}
.ex .a{font-family:'DM Mono',monospace;font-weight:500;font-size:15px;white-space:nowrap}
.ex.settle{background:#F1FAF4;border-color:#B5DDC5}
details.card summary{font-weight:600;cursor:pointer;padding:2px 0}
table.bal{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.bal th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:right;padding:4px 3px}
table.bal th:first-child,table.bal td:first-child{text-align:left}
table.bal td{padding:7px 3px;border-top:1px dashed var(--line);text-align:right;font-family:'DM Mono',monospace;font-size:12.5px}
table.bal td:first-child{font-family:'Outfit',sans-serif;font-size:13px}
.pos-n{color:var(--green)} .neg-n{color:var(--red)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .chip{padding:8px 12px;font-size:14px;font-family:inherit}
.hhs{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.hhs .chip{border-radius:12px;justify-content:flex-start;padding:9px 11px;text-align:left}
.hhs .chip:not(.on){opacity:.9}
.live{font-family:'DM Mono',monospace;font-size:13.5px;background:var(--sand-deep);border-radius:10px;padding:9px 12px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="home.html">← Home</a>
  <p class="eyebrow">Square by New Year</p>
  <h1 class="wordmark">Money</h1>
  <p class="sub" id="sub">Shared costs, family by family</p>
</header>

<main>
  <div class="card pos sq" id="pos"><div class="empty">Adding it up…</div></div>
  <div class="card" id="who"></div>
  <button class="btn red addbtn" id="add2">+ Add an expense</button>
  <div id="list"></div>
  <h2 class="sec">Every family</h2>
  <details class="card" id="bal"><summary>Paid, share and balance</summary><div id="balBody"></div></details>
  <h2 class="sec">Spent by kind</h2>
  <div class="card" id="kinds"></div>
  <button class="fab" id="add" aria-label="Add expense">+</button>
  <p class="buildstamp">build x40</p>
</main>

<script type="module">
import { boot, me, col, watchTrip, heroFromWall, tripDays, fmtLong, fromIso, todayIso, households, household, onPeople,
         hereOn, badge, esc, aud, celebrate, toast, openSheet, closeSheet, isMuted, myHousehold } from "./app.js";

if(boot("money.html")){
const $ = id => document.getElementById(id);
heroFromWall();
const ex = col("expenses");
const KINDS = [["food","🍤","Food"],["drinks","🍹","Drinks"],["camp","🏕️","Camp"],["fun","🎟️","Fun"],["other","🧾","Other"]];
const EMO = { food:"🍤", drinks:"🍹", camp:"🏕️", fun:"🎟️", other:"🧾", settle:"🤝" };
let rows = [], trip = null, armed = "";
const cents = n => Math.round((+n || 0) * 100);
const money = c => aud(c / 100);
const hhName = id => household(id).name;
const tag = id => `${badge(id)} ${esc(hhName(id))}`;

/* ---------- the maths (all in cents) ---------- */
function calc(list){
  const paid = {}, owed = {}, add = (o, k, v) => { o[k] = (o[k] || 0) + v; };
  households().forEach(h => { paid[h.id] = 0; owed[h.id] = 0; });
  list.forEach(e => {
    const c = cents(e.amount), ids = (e.split || []).filter(Boolean);
    if(!c || !ids.length || !e.paidBy) return;
    let w = e.mode === "heads" ? ids.map(i => household(i).members.length) : ids.map(() => 1);
    let W = w.reduce((a, b) => a + b, 0);
    if(!W){ w = ids.map(() => 1); W = ids.length; }
    let sum = 0;
    ids.forEach((id, i) => { const s = Math.floor(c * w[i] / W); sum += s; add(owed, id, s); });
    add(paid, e.paidBy, c);
    add(owed, e.paidBy, c - sum);   // rounding leftover goes to the payer
  });
  const bal = {}; Object.keys({ ...paid, ...owed }).forEach(k => { bal[k] = (paid[k] || 0) - (owed[k] || 0); });
  return { paid, owed, bal };
}
function transfers(bal){
  const d = [], c = [];
  Object.entries(bal).forEach(([id, b]) => { if(b < 0) d.push({ id, v:-b }); else if(b > 0) c.push({ id, v:b }); });
  const out = [];
  while(d.length && c.length){
    d.sort((a, b) => b.v - a.v); c.sort((a, b) => b.v - a.v);
    const x = d[0], y = c[0], t = Math.min(x.v, y.v);
    out.push({ from:x.id, to:y.id, cents:t }); x.v -= t; y.v -= t;
    if(!x.v) d.shift(); if(!y.v) c.shift();
  }
  return out;
}

/* ---------- sound ---------- */
function chaChing(){
  if(isMuted()) return;
  try{
    const c = new (window.AudioContext || window.webkitAudioContext)(), t = c.currentTime + 0.02;
    [[1318.5, 0], [1760, 0.09], [2093, 0.2]].forEach(([f, d]) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.07, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.35);
      o.connect(g); g.connect(c.destination); o.start(t + d); o.stop(t + d + 0.4);
    });
    setTimeout(() => c.close && c.close(), 1200);
  }catch(e){}
}

/* ---------- painting ---------- */
function paint(){
  const { paid, owed, bal } = calc(rows), mine = me.hh, mb = bal[mine] || 0, xs = transfers(bal);
  const P = $("pos");
  P.className = "card pos " + (mb > 0 ? "owed" : mb < 0 ? "owes" : "sq");
  P.innerHTML = `<div class="muted small">${tag(mine)}</div><div class="big">${mb > 0 ? `Your family is owed ${money(mb)}` : mb < 0 ? `Your family owes ${money(-mb)}` : "All square"}</div>
    <div class="muted small">${rows.length ? "Worked out from every expense below" : "No expenses yet"}</div>`;
  $("who").innerHTML = `<div class="mono small muted" style="letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px">Who pays who</div>` +
    (xs.length ? xs.map(x => { const key = x.from + "|" + x.to + "|" + x.cents, isArm = armed === key;
      return `<div class="xf${x.from === mine || x.to === mine ? " mine" : ""}"><div class="who"><b>${tag(x.from)}</b><br>pays ${tag(x.to)}</div>
        <span class="amt">${money(x.cents)}</span><button class="btn small ${isArm ? "red" : "green"}" data-k="${key}">${isArm ? "Sure?" : "Paid ✓"}</button></div>`; }).join("")
      : `<div class="empty" style="padding:12px">Nobody owes anybody. 🎉</div>`);

  // list, grouped by date, newest first
  const sorted = [...rows].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
  let html = "", last = null;
  sorted.forEach(e => {
    if(e.date !== last){ last = e.date; html += `<div class="dayh">${e.date ? esc(fmtLong(fromIso(e.date))) : "No date"}</div>`; }
    const n = (e.split || []).length;
    html += `<button class="ex ${e.kind === "settle" ? "settle" : ""}" data-id="${esc(e.id)}"><span class="e">${EMO[e.kind] || "🧾"}</span>
      <span class="t"><b>${esc(e.what || "Expense")}</b><span>${e.kind === "settle" ? `${tag(e.paidBy)} → ${(e.split || []).map(tag).join(", ")}` : `${tag(e.paidBy)} paid · split ${n} ${n === 1 ? "family" : "families"}`}</span></span>
      <span class="a">${aud(e.amount)}</span></button>`;
  });
  $("list").innerHTML = html || `<div class="empty">Nothing yet. Bought the snags or paid for the gas? Tap Add an expense.</div>`;

  $("balBody").innerHTML = `<table class="bal"><tr><th>Family</th><th>Paid</th><th>Share</th><th>Balance</th></tr>` +
    households().map(h => { const b = bal[h.id] || 0;
      return `<tr><td>${badge(h.id)} ${esc(h.name)}</td><td>${money(paid[h.id] || 0)}</td><td>${money(owed[h.id] || 0)}</td><td class="${b > 0 ? "pos-n" : b < 0 ? "neg-n" : ""}">${b > 0 ? "+" : ""}${money(b)}</td></tr>`; }).join("") + `</table>`;

  const tot = {}; let all = 0;
  rows.filter(e => e.kind !== "settle").forEach(e => { const k = e.kind || "other"; tot[k] = (tot[k] || 0) + cents(e.amount); all += cents(e.amount); });
  $("kinds").innerHTML = all ? KINDS.filter(k => tot[k[0]]).map(k => `<div class="xf"><span style="font-size:22px">${k[1]}</span><div class="who">${k[2]}</div><span class="amt">${money(tot[k[0]])}</span></div>`).join("") +
    `<div class="xf"><div class="who"><b>Everything</b></div><span class="amt"><b>${money(all)}</b></span></div>` : `<div class="empty" style="padding:10px">Nothing spent yet</div>`;
}

$("who").addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-k]"); if(!b) return;
  const key = b.dataset.k;
  if(armed !== key){ armed = key; paint(); setTimeout(() => { if(armed === key){ armed = ""; paint(); } }, 4000); return; }
  armed = ""; const [from, to, c] = key.split("|");
  try{ await ex.add({ what:"Settled up", amount:+c / 100, paidBy:from, split:[to], mode:"even", date:todayIso(), kind:"settle", note:"" }); toast("Marked as paid"); }
  catch(e){ toast("Couldn't save — " + e.message); }
});
$("list").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-id]"); if(!b) return;
  const e = rows.find(r => r.id === b.dataset.id); if(e) openForm(e);
});

/* ---------- add / edit sheet ---------- */
function defaultDate(){
  const t = todayIso(); if(!trip) return t;
  const days = tripDays(trip), a = days[0].iso, z = days[days.length - 1].iso;
  return t < a ? a : t > z ? z : t;
}
function openForm(e){
  if(e && e.kind === "settle"){
    const sh = openSheet(`<h3>🤝 Settled up</h3><p>${tag(e.paidBy)} paid ${(e.split || []).map(tag).join(", ")} <b>${aud(e.amount)}</b></p>
      <p class="muted small">${e.date ? esc(fmtLong(fromIso(e.date))) : ""}</p>
      <div class="acts"><button class="btn ghost" id="x">Close</button><button class="btn red" id="del">Delete</button></div>`);
    sh.el.querySelector("#x").onclick = closeSheet; delBtn(sh, e); return;
  }
  const hs = households();
  let kind = e ? e.kind : "food", mode = e ? e.mode : "heads", paidBy = e ? e.paidBy : me.hh;
  let sel = new Set(e ? e.split : []), touched = !!e;
  const dd = e ? e.date : defaultDate();
  const sh = openSheet(`<h3>${e ? "Edit expense" : "Add an expense"}</h3>
    <label class="f" for="mw">What was it?</label><input class="in" id="mw" maxlength="60" placeholder="e.g. Prawns for Christmas lunch" value="${esc(e ? e.what : "")}">
    <div class="row"><div><label class="f" for="ma">Amount ($)</label><input class="in" id="ma" inputmode="decimal" placeholder="0.00" value="${e ? (+e.amount).toFixed(2) : ""}"></div>
    <div><label class="f" for="md">Date</label><input class="in" id="md" type="date" value="${dd}"></div></div>
    <label class="f" for="mp">Who paid?</label><select class="in" id="mp">${hs.map(h => `<option value="${h.id}"${h.id === paidBy ? " selected" : ""}>${esc(h.name)}</option>`).join("")}</select>
    <label class="f">Split between</label>
    <div class="chips" style="margin-bottom:8px"><button type="button" class="chip" data-q="all">Everyone</button><button type="button" class="chip" data-q="here">Everyone here that day</button><button type="button" class="chip" data-q="none">None</button></div>
    <div class="hhs" id="mh">${hs.map(h => `<button type="button" class="chip" data-h="${h.id}" aria-pressed="false">${badge(h.id)} ${esc(h.name)} <span class="muted small">(${h.members.length})</span></button>`).join("")}</div>
    <label class="f">Split</label>
    <div class="chips"><button type="button" class="chip" data-m="heads">By head</button><button type="button" class="chip" data-m="even">Even per family</button></div>
    <div class="live" id="ml"></div>
    <label class="f">Kind</label>
    <div class="chips" id="mk">${KINDS.map(k => `<button type="button" class="chip" data-k="${k[0]}">${k[1]} ${k[2]}</button>`).join("")}</div>
    <label class="f" for="mn">Note (optional)</label><input class="in" id="mn" maxlength="120" value="${esc(e ? e.note || "" : "")}">
    <div class="acts">${e ? `<button class="btn red" id="del">Delete</button>` : `<button class="btn ghost" id="no">Cancel</button>`}<button class="btn green" id="ok">${e ? "Save" : "Add it"}</button></div>`);
  const q = s => sh.el.querySelector(s), qa = s => [...sh.el.querySelectorAll(s)];
  const here = () => { const d = q("#md").value || todayIso(); const ids = hs.filter(h => hereOn(h, d)).map(h => h.id); return new Set(ids.length ? ids : hs.map(h => h.id)); };
  if(!e) sel = here();
  const live = () => {
    const a = parseFloat(String(q("#ma").value).replace(/[^0-9.]/g, "")) || 0, ids = [...sel];
    const heads = ids.reduce((n, i) => n + household(i).members.length, 0);
    q("#ml").textContent = !ids.length ? "Pick at least one family" : !a ? "Type an amount" :
      mode === "heads" && heads ? `≈ ${aud(a / heads)} per person (${heads} people)` : `≈ ${aud(a / ids.length)} per family (${ids.length})`;
  };
  const sync = () => {
    qa("[data-h]").forEach(b => { const on = sel.has(b.dataset.h); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    qa("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
    qa("#mk [data-k]").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
    live();
  };
  sh.el.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    if(b.dataset.h){ touched = true; sel.has(b.dataset.h) ? sel.delete(b.dataset.h) : sel.add(b.dataset.h); }
    else if(b.dataset.q){ touched = true; sel = b.dataset.q === "all" ? new Set(hs.map(h => h.id)) : b.dataset.q === "none" ? new Set() : here(); }
    else if(b.dataset.m) mode = b.dataset.m;
    else if(b.dataset.k && b.closest("#mk")) kind = b.dataset.k;
    else return;
    sync();
  });
  q("#ma").addEventListener("input", live);
  q("#md").addEventListener("change", () => { if(!touched) sel = here(); sync(); });
  sync();
  if(q("#no")) q("#no").onclick = closeSheet;
  if(e) delBtn(sh, e);
  q("#ok").onclick = async () => {
    const what = q("#mw").value.trim(), amount = Math.round((parseFloat(String(q("#ma").value).replace(/[^0-9.]/g, "")) || 0) * 100) / 100;
    if(!what) return toast("What was it for?");
    if(!(amount > 0)) return toast("How much was it?");
    if(!sel.size) return toast("Pick who shares it");
    const v = { what, amount, paidBy:q("#mp").value, split:[...sel], mode, date:q("#md").value || todayIso(), kind, note:q("#mn").value.trim() };
    closeSheet();
    try{
      if(e) await ex.update(e.id, v);
      else { celebrate("expense"); chaChing(); await ex.add(v); }
    }catch(err){ toast("Couldn't save — " + err.message); }
  };
}
function delBtn(sh, e){
  const b = sh.el.querySelector("#del"); let armedDel = false;
  b.onclick = async () => {
    if(!armedDel){ armedDel = true; b.textContent = "Really delete?"; return; }
    closeSheet(); try{ await ex.remove(e.id); toast("Deleted"); }catch(err){ toast("Couldn't delete — " + err.message); }
  };
}
$("add").onclick = () => openForm(null);
$("add2").onclick = () => openForm(null);

watchTrip(t => { trip = t; });
onPeople(paint);
ex.subscribe(r => { rows = r; paint(); });
}
</script>
</body>
</html>
