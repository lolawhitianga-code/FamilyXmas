<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Xmas">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Daily awards · Christmas at Bateau Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.cat h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.cat h3 .e{font-size:24px}
.mine{display:flex;align-items:center;gap:10px;background:var(--sand);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:15px}
.mine span{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .nm{flex:none;width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;background:var(--sand-deep);border-radius:8px;height:20px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px;min-width:6px}
.bar .c{flex:none;width:28px;text-align:right;font-family:'DM Mono',monospace;font-size:13px}
.whys{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.whys p{margin:4px 0;font-size:13.5px}
.podium{background:linear-gradient(160deg,#FFF8E1,#FFEBB5);border-color:var(--gold)}
.podium h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 8px}
.podium .w{display:flex;gap:8px;padding:6px 0;border-top:1px dashed rgba(18,48,59,.15);font-size:15px;align-items:baseline}
.podium .w:first-of-type{border-top:0}
.podium .w b{flex:none}
.podium .w span{flex:1;min-width:0}
.pickrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.pick{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;display:inline-flex;gap:7px;align-items:center}
.pick.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pick.on .dot{box-shadow:0 0 0 2px #fff}
.hhl{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:10px 0 2px}
.picks{max-height:42vh;overflow:auto;margin:0 -4px;padding:0 4px}
.crow{display:flex;gap:6px;margin-bottom:8px}
.crow .in:first-child{flex:none;width:58px;text-align:center}
.crow .in{padding:9px 8px}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="fun.html">← Games &amp; Awards</a>
  <p class="eyebrow">Nominations are open</p>
  <h1 class="wordmark">Daily awards</h1>
  <p class="sub" id="sub">Who deserved it today?</p>
</header>

<main>
  <div class="days" id="days"></div>
  <div id="day"><div class="empty">Loading…</div></div>
  <h2 class="sec">Hall of fame</h2>
  <div class="card" id="hall"><div class="empty">Winners will show up here once a day is done.</div></div>
  <p style="text-align:center"><button class="btn small ghost" id="edit">Organiser: edit categories</button></p>
  <p class="buildstamp">build x41</p>
</main>

<script type="module">
import { boot, me, col, settings, celebrate, toast, openSheet, closeSheet, askPin, esc, watchTrip, tripDays, fmtLong,
         todayIso, XMAS_DAY, people, households, hereOn, pname, badge, person, onPeople, heroFromWall, tapName } from "./app.js";

if(boot("awards.html")){
const $ = id => document.getElementById(id);
heroFromWall();

const DEFAULT_CATS = [
  { id:"legend",   emoji:"🏆", name:"Legend of the day" },
  { id:"spit",     emoji:"😤", name:"Dummy spit" },
  { id:"wipeout",  emoji:"🌊", name:"Best wipeout" },
  { id:"feed",     emoji:"🍳", name:"Best feed" },
  { id:"funny",    emoji:"😂", name:"Funniest moment" },
  { id:"asleep",   emoji:"😴", name:"First asleep" }
];
let trip = null, cats = DEFAULT_CATS, votes = [], day = null;   // day = ISO date picked

const voteId = (d, c, v) => `${d}_${c}_${v}`;
const myVote = (d, c) => votes.find(v => v.id === voteId(d, c, me.id));

/* tally one category on one day -> sorted [{id, n}] */
function tally(d, c){
  const m = {};
  votes.filter(v => v.date === d && v.cat === c && v.pick).forEach(v => { m[v.pick] = (m[v.pick] || 0) + 1; });
  return Object.entries(m).map(([id, n]) => ({ id, n })).sort((a, b) => b.n - a.n || pname(a.id).localeCompare(pname(b.id)));
}
const winners = t => t.length ? t.filter(x => x.n === t[0].n) : [];

function paintDays(){
  if(!trip) return;
  $("days").innerHTML = tripDays(trip).map(d =>
    `<button data-d="${d.iso}" class="${d.iso === day ? "on" : ""}${d.iso === XMAS_DAY ? " xmas" : ""}"><b>${d.date.getDate()}</b><span>${d.date.toLocaleDateString("en-NZ", { weekday:"short" })}</span></button>`).join("");
  const on = $("days").querySelector(".on"); if(on) on.scrollIntoView({ inline:"center", block:"nearest" });
}

function catCard(c, future, past){
  const t = tally(day, c.id), lead = winners(t).map(x => x.id);
  const mv = myVote(day, c.id);
  let h = `<div class="card cat"><h3><span class="e">${esc(c.emoji)}</span>${esc(c.name)}</h3>`;
  if(future) return h + `<div class="muted small">Opens on the day</div></div>`;
  h += mv ? `<div class="mine"><span>Your pick: ${badge(mv.pick)} <b>${tapName(mv.pick)}</b></span><button class="btn small ghost" data-vote="${esc(c.id)}">Change</button></div>`
          : `<button class="btn red wide" data-vote="${esc(c.id)}" style="margin-bottom:10px">Vote</button>`;
  if(!t.length) return h + `<div class="muted small">No votes yet — be the first.</div></div>`;
  const max = t[0].n, top = t.slice(0, 3), rest = t.length - top.length;
  h += top.map(x => `<div class="bar"><span class="nm">${lead.includes(x.id) ? "👑 " : ""}${tapName(x.id)}</span>
      <span class="tr"><i style="width:${Math.round(x.n / max * 100)}%;background:${person(x.id).colour}"></i></span><span class="c">${x.n}</span></div>`).join("");
  if(rest > 0) h += `<div class="muted small">+ ${rest} other${rest === 1 ? "" : "s"} with votes</div>`;
  const whys = votes.filter(v => v.date === day && v.cat === c.id && v.why).slice(0, 8);
  if(whys.length) h += `<div class="whys">${whys.map(v => `<p>“${esc(v.why)}” <span class="muted small">— for ${tapName(v.pick)}, from ${tapName(v.voter)}</span></p>`).join("")}</div>`;
  return h + `</div>`;
}

function paintDay(){
  if(!trip || !day) return;
  const today = todayIso(), future = day > today, past = day < today;
  $("sub").textContent = fmtLong(new Date(day + "T00:00:00")) + (future ? " · opens on the day" : past ? " · done" : " · today");
  let h = "";
  if(past){
    const rows = cats.map(c => ({ c, w: winners(tally(day, c.id)) })).filter(r => r.w.length);
    h += `<div class="card podium"><h3>🏅 The podium</h3>` + (rows.length
      ? rows.map(r => `<div class="w"><b>${esc(r.c.emoji)}</b><span>${esc(r.c.name)}: <b>${r.w.map(x => tapName(x.id)).join(" &amp; ")}</b> <span class="muted small">(${r.w[0].n})</span></span></div>`).join("")
      : `<div class="muted small">Nobody voted on this day.</div>`) + `</div>`;
  }
  h += cats.map(c => catCard(c, future, past)).join("");
  $("day").innerHTML = h;
}

function paintHall(){
  const today = todayIso(), done = new Set(votes.filter(v => v.date < today).map(v => v.date));
  if(!done.size) return;
  const rows = cats.map(c => {
    const wins = {};
    done.forEach(d => winners(tally(d, c.id)).forEach(x => { wins[x.id] = (wins[x.id] || 0) + 1; }));
    const e = Object.entries(wins).sort((a, b) => b[1] - a[1]);
    return { c, top: e.filter(x => x[1] === (e[0] || [])[1]) };
  }).filter(r => r.top.length);
  if(!rows.length) return;
  $("hall").innerHTML = rows.map(r => `<div class="bar" style="margin:9px 0"><span style="font-size:22px">${esc(r.c.emoji)}</span>
    <span style="flex:1;min-width:0"><b>${esc(r.c.name)}</b><br>${r.top.map(x => `${badge(x[0])} ${tapName(x[0])}`).join(" · ")} <span class="muted small">${r.top[0][1]} day${r.top[0][1] === 1 ? "" : "s"}</span></span></div>`).join("");
}

const paintAll = () => { paintDays(); paintDay(); paintHall(); };

/* ---------- voting sheet ---------- */
function openVote(c){
  const had = myVote(day, c.id);
  let pick = had ? had.pick : null, showAll = false, q = "";
  const sh = openSheet(`<h3>${esc(c.emoji)} ${esc(c.name)}</h3>
    <input class="in" id="q" placeholder="Search names…" autocomplete="off">
    <div class="picks" id="pk"></div>
    <label class="chk" style="display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0"><input type="checkbox" id="all"> Show everyone, not just who's at camp</label>
    <label class="f" for="why">Why? (optional)</label><input class="in" id="why" maxlength="120" value="${esc(had ? had.why : "")}" placeholder="One line is plenty">
    <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn red" id="go">${had ? "Change my vote" : "Vote"}</button></div>
    ${had ? `<p style="text-align:center;margin:10px 0 0"><button class="btn small ghost" id="rm">Take my vote back</button></p>` : ""}`);
  const el = s => sh.el.querySelector(s);
  const list = () => {
    let h = "";
    households().forEach(hh => {
      if(!showAll && !hereOn(hh, day)) return;
      const ms = hh.members.filter(p => p.label.toLowerCase().includes(q) || hh.name.toLowerCase().includes(q));
      if(!ms.length) return;
      h += `<div class="hhl">${badge(hh.id)} ${esc(hh.name)}</div><div class="pickrow">` +
        ms.map(p => `<button class="pick ${p.id === pick ? "on" : ""}" data-p="${esc(p.id)}">${esc(p.label)}</button>`).join("") + `</div>`;
    });
    el("#pk").innerHTML = h || `<div class="empty">No one found${showAll ? "" : " at camp that day — try “show everyone”"}.</div>`;
  };
  list();
  el("#q").oninput = e => { q = e.target.value.trim().toLowerCase(); list(); };
  el("#all").onchange = e => { showAll = e.target.checked; list(); };
  el("#pk").onclick = e => { const b = e.target.closest("[data-p]"); if(b){ pick = b.dataset.p; list(); } };
  el("#no").onclick = () => closeSheet();
  if(had) el("#rm").onclick = async () => { closeSheet(); try{ await col("votes").remove(had.id); }catch(err){ toast("Couldn't save — " + err.message); } };
  el("#go").onclick = async () => {
    if(!pick) return toast("Tap who it was first");
    const why = el("#why").value.trim(), d = day;
    closeSheet(); if(!had) celebrate("vote");
    try{ await col("votes").set(voteId(d, c.id, me.id), { date:d, cat:c.id, voter:me.id, pick, why }); }
    catch(err){ toast("Couldn't save — " + err.message); }
  };
}

/* ---------- organiser: edit categories ---------- */
async function editCats(){
  if(!(await askPin("Only organisers change the award categories."))) return;
  let draft = cats.map(c => ({ ...c }));
  const sh = openSheet(`<h3>Award categories</h3><p class="muted small">Removing one hides its votes. Nothing changes until you save.</p><div id="rows"></div>
    <button class="btn small ghost" id="add">+ Add a category</button>
    <div class="acts"><button class="btn ghost" id="no">Cancel</button><button class="btn green" id="go">Save</button></div>`);
  const el = s => sh.el.querySelector(s);
  const sync = () => sh.el.querySelectorAll(".crow").forEach((r, i) => { draft[i].emoji = r.querySelector(".em").value.trim() || "⭐"; draft[i].name = r.querySelector(".nm").value.trim(); });
  const rows = () => {
    el("#rows").innerHTML = draft.map((c, i) => `<div class="crow"><input class="in em" value="${esc(c.emoji)}" maxlength="4" aria-label="Emoji"><input class="in nm" value="${esc(c.name)}" aria-label="Name" placeholder="Name"><button class="btn small ghost" data-rm="${i}" aria-label="Remove">✕</button></div>`).join("");
  };
  rows();
  el("#rows").onclick = e => { const b = e.target.closest("[data-rm]"); if(b){ sync(); draft.splice(+b.dataset.rm, 1); rows(); } };
  el("#add").onclick = () => { sync(); draft.push({ id:"c" + Date.now().toString(36), emoji:"⭐", name:"" }); rows(); };
  el("#no").onclick = () => closeSheet();
  el("#go").onclick = async () => {
    sync(); draft = draft.filter(c => c.name);
    if(!draft.length) return toast("Keep at least one category");
    closeSheet();
    try{ await settings("awards").save({ cats:draft }); }catch(err){ toast("Couldn't save — " + err.message); }
  };
}

/* ---------- wiring ---------- */
$("days").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if(b){ day = b.dataset.d; paintAll(); } });
$("day").addEventListener("click", e => {
  const b = e.target.closest("[data-vote]"); if(!b) return;
  const c = cats.find(x => x.id === b.dataset.vote); if(c) openVote(c);
});
$("edit").onclick = editCats;

watchTrip(t => {
  trip = t;
  const ds = tripDays(t).map(d => d.iso);
  if(!day || !ds.includes(day)) day = ds.includes(todayIso()) ? todayIso() : ds[0];
  paintAll();
});
settings("awards").subscribe(s => { cats = s && Array.isArray(s.cats) && s.cats.length ? s.cats : DEFAULT_CATS; paintAll(); });
col("votes").subscribe(r => { votes = r; paintAll(); });
onPeople(paintAll);
}
</script>
</body>
</html>
